# ═══════════════════════════════════════════════
# docker-compose.yml — Portfolio Antony Vera
# Uso: docker compose up -d
# ═══════════════════════════════════════════════

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-antony
    ports:
      - "80:80"
    restart: unless-stopped
    environment:
      - TZ=America/Lima
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Límites de recursos (buena práctica)
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

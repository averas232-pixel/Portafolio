# ═══════════════════════════════════════════════
# nginx.conf — Portfolio con headers de seguridad
# ═══════════════════════════════════════════════

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──
    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ──
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # ── Ocultar versión de nginx (seguridad) ──
    server_tokens off;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # ── Headers de seguridad ──
        add_header X-Frame-Options           "SAMEORIGIN"                        always;
        add_header X-Content-Type-Options    "nosniff"                           always;
        add_header X-XSS-Protection          "1; mode=block"                     always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"   always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

        # ── Cache para assets estáticos ──
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2|woff)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ── SPA fallback ──
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Bloquear acceso a archivos ocultos ──
        location ~ /\. {
            deny all;
            return 404;
        }

        # ── Bloquear archivos sensibles ──
        location ~* \.(env|log|sh|conf|json)$ {
            deny all;
            return 404;
        }
    }
}
